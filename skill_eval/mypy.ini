[mypy]
python_version = 3.10
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
check_untyped_defs = True
show_error_codes = True

# Configure specific module overrides rather than a global ignore flag
[mypy-google.antigravity.*]
ignore_missing_imports = True

[mypy-google.antigravity]
ignore_missing_imports = True

[mypy-cxas_scrapi.*]
ignore_missing_imports = True

[mypy-cxas_scrapi]
ignore_missing_imports = True

