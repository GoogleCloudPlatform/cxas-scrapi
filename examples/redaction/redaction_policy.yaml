# redaction_policy.yaml — app-wide redaction contract
#
# Place this file next to your app (commands and evals find the nearest one).
# Validate:  cxas redaction validate
# Replay:    cxas redaction replay --app-name <app> --evaluation-run <run>
# Live:      cxas redaction live --app-name <app> --script redaction_script.yaml
#
# All sample values below are synthetic test values.

version: 1
description: Example billing assistant (payments, benefits, crisis support)

categories:
  # --- Must be removed from persisted conversation data ---------------------
  - id: payment_card
    action: must_redact
    description: Payment card numbers, including spoken and spaced forms
    match: digits
    values: ["4111 1111 1111 1111", "5500 0000 0000 0004"]
    keys: [card_number, payment_card]
    allow_last: 4             # "card ending in 1111" may remain visible

  - id: card_security_code
    action: must_redact
    keys: [cvv, cvc, security_code]

  - id: bank_routing
    action: must_redact
    match: digits
    values: ["021000021"]
    keys: [routing_number]

  - id: bank_account
    action: must_redact
    match: digits
    keys: [account_number]

  # --- Must stay readable -----------------------------------------------------
  - id: emergency_numbers
    action: must_not_redact
    description: Crisis and emergency lines read out by the agent
    match: digits
    values: ["988", "911"]

  - id: percentages
    action: must_not_redact
    patterns: ['\b\d{1,3}\s?(?:%|percent)']

  - id: currency_amounts
    action: must_not_redact
    patterns: ['\$\d[\d,]*(?:\.\d{2})?']

  - id: member_id
    action: must_not_redact
    values: ["MBR-0042-7781"]
    keys: [member_id]

  - id: caller_phone
    action: must_not_redact
    match: digits
    keys: [caller_phone]

  - id: operational_fields
    action: must_not_redact
    description: Fields needed for debugging and analytics
    keys: [status_code, order_id, confirmation_number, ticket_id]

  # --- Tracked, never fails -----------------------------------------------------
  - id: card_expiry
    action: report_only
    description: Decision pending; track how it is handled today
    patterns: ['\b(?:0[1-9]|1[0-2])/\d{2}\b']

# Parts of each conversation to check (default: all).
surfaces: [user_text, agent_text, tool_args, tool_response, variables]

thresholds:
  max_leaks: 0
  max_partial_leaks: 0
  max_over_redactions: 0
