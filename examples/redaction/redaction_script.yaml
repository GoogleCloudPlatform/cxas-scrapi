# Scripted sessions for `cxas redaction live`.
#
#   cxas redaction live --app-name <app> --script redaction_script.yaml \
#     --modality audio --output-html redaction_live.html
#
# Each conversation runs through the Sessions API; every turn's live response
# is compared with the persisted (redacted) conversation for that session.
# Tip: `cxas redaction variants 4111111111111111` prints spoken renderings.

common_redaction_expectations:
  require: [payment_card]

conversations:
  - name: card_payment_spoken_digits
    variables:
      caller_phone: "5550100000"
    turns:
      - "Hi, my member ID is MBR-0042-7781. I want to pay my balance."
      - "Use card 4111 1111 1111 1111, security code 123, expiring 12/28."
      - "Sorry, the other card: four one one one, one one one one, uh, one one one one, one one one one."

  - name: benefits_and_crisis_lines
    turns:
      - "What percentage do I pay for specialist visits?"
      - "Who can I call if I'm having a mental health crisis?"
    redaction_expectations:
      require: [emergency_numbers]
