# Simulations with redaction checks.
#
# `redaction_expectations` is optional. When set, the sim's conversation is
# compared with the persisted (redacted) copy of its session after the run,
# using the nearest redaction_policy.yaml. A failed redaction check fails the
# eval. The policy holds the redact / don't-redact decisions; evals only
# declare which values they seed and which categories they must exercise.

common_redaction_expectations: true

evals:
  - name: pay_balance_by_card
    tags: [P0, payments, redaction]
    steps:
      - goal: Pay the outstanding balance by card
        success_criteria: The agent confirms the payment and gives a confirmation number
        response_guide: >
          Your member ID is MBR-0042-7781. When asked for a card, read the
          number 4111 1111 1111 1111 digit by digit with a short pause after
          each group of four. The security code is 123 and it expires 12/28.
        max_turns: 8
    expectations:
      - "The agent must confirm the payment"
    redaction_expectations:
      values:
        card_security_code: ["123"]
      require: [payment_card, card_security_code]

  - name: crisis_line_disclosure
    tags: [P0, safety, redaction]
    steps:
      - goal: Ask who to contact during a mental health crisis
        success_criteria: The agent provides the crisis line
        max_turns: 4
    redaction_expectations:
      require: [emergency_numbers]

  - name: general_question
    tags: [P2]
    steps:
      - goal: Ask about office hours
        success_criteria: The agent answers
        max_turns: 3
    redaction_expectations: false   # opt out of the file-wide setting
