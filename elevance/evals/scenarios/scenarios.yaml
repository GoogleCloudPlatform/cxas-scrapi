  audio_expectations:
  - title: "Spoken STT Telephony Mismatch Audit"
    expectation: "The spoken audio transcript for the AGENT turns must accurately match the transcript from the bidiRunSession for the AGENT turns SEMANTICALLY. You must ignore minor telephony variations, exact capitalization differences, and interchangeable conversational fillers (like 'OK' vs 'okay'). However, you MUST flag and explain any material divergence in clinical meaning, incorrect precertification status, or severe state mismatches. (CRITICAL: You must ONLY evaluate the agent's output turns; ignore user input/transcription completely). Additionally, you MUST flag as a mismatch if the agent's spoken audio uses the terms 'prior authorization', 'pre-authorization', or 'authorization' instead of 'pre certification' or 'precertification' for procedure code checks, as using the exact pre certification terminology is required."
