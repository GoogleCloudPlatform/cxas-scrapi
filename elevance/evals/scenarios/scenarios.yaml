    success_criteria: Agent asks for Date of Birth.
  - static_utterance: "1990-11-27"
    response_guide: "Provide DOB '1990-11-27' when asked."
    success_criteria: Agent asks if this is for an Inpatient or Outpatient service.
  - static_utterance: "Outpatient"
    response_guide: "Say 'Outpatient' when asked for service setting."
    success_criteria: Agent asks for specific service.
  - static_utterance: "Something else"
    response_guide: "Say 'Something else' when asked for service."
    success_criteria: Agent asks for procedure code.
  - static_utterance: "93461"
    response_guide: "Provide procedure code '93461' when asked."
    success_criteria: Agent states precert required and asks if you have another code.
  - static_utterance: "Yes"
    response_guide: "Say 'Yes' when asked if you have another code."
    success_criteria: Agent asks for next procedure code.
  - static_utterance: "69435"
    response_guide: "Provide procedure code '69435' when asked."
    success_criteria: Agent states precert not required (but pre-determination required) and asks what to do next.
  - static_utterance: "No"
    response_guide: "Say 'No' when asked if you want to check another service or member."
    success_criteria: Agent asks if you'd like a reference number.
  - static_utterance: "Yes"
    response_guide: "Say 'Yes' when asked if you want a reference number."
    success_criteria: Agent provides a reference number and asks if call is resolved.
  - static_utterance: "Yes"
    response_guide: "Say 'Yes' when asked if call is resolved."
    success_criteria: Agent ends the session successfully.
