evals:
- name: Retry Confusion Test
  tags: [retry, member_authentication, P0]
  steps:
  - static_utterance: "Hi"
    success_criteria: Agent asks for NPI.
  - static_utterance: "1234567890"
    response_guide: "When the agent asks for your National Provider ID, reply with '1234567890'."
    success_criteria: Agent asks for Member ID.
  - static_utterance: "invalid"
    response_guide: "When the agent asks for the Member ID for the first time, reply with 'invalid'."
    success_criteria: Agent asks for the Member ID again.
  - static_utterance: "259W17936"
    response_guide: "When the agent asks for the Member ID again after you provided an invalid one, reply with '259W17936'."
    success_criteria: Agent asks for Date of Birth.
  - static_utterance: "1985-11-16"
    response_guide: "When the agent asks for the member's Date of Birth, reply with '1985-11-16'."
    success_criteria: Agent asks if this is for an Inpatient service.
  expectations:
  - 'TOOL CALL: Agent must call `unified_member_verification`.'

- name: Multi-Validation Failure Test
  tags: [retry, member_authentication, P0]
  steps:
  - static_utterance: "Hi"
    success_criteria: Agent asks for NPI.
  - static_utterance: "1234567890"
    response_guide: "When the agent asks for your National Provider ID, reply with '1234567890'."
    success_criteria: Agent asks for Member ID.
  - static_utterance: "259W17936"
    response_guide: "Provide '259W17936' as the Member ID when the agent asks for the Member ID for the first time."
    success_criteria: Agent asks for Date of Birth.
  - static_utterance: "1990-01-01"
    response_guide: "Provide '1990-01-01' as the Date of Birth when the agent asks for the member's Date of Birth for the first time."
    success_criteria: Agent states it was unable to verify the member and asks if the details are correct.
  - static_utterance: "Yes"
    response_guide: "Say 'Yes' when the agent asks if the details are correct for the first time."
    success_criteria: Agent clears the fields and asks for Member ID again.
  - static_utterance: "259W17936"
    response_guide: "Provide '259W17936' as the Member ID when the agent asks for the Member ID again for the second time."
    success_criteria: Agent asks for Date of Birth.
  - static_utterance: "1990-01-01"
    response_guide: "Provide '1990-01-01' as the Date of Birth when the agent asks for the member's Date of Birth again for the second time."
    success_criteria: Agent states it was unable to verify the member and asks if the details are correct.
  - static_utterance: "Yes"
    response_guide: "Say 'Yes' when the agent asks if the details are correct for the second time."
    success_criteria: Agent clears the fields and asks for Member ID again.
  - static_utterance: "259W17936"
    response_guide: "Provide '259W17936' as the Member ID when the agent asks for the Member ID for the third time."
    success_criteria: Agent asks for Date of Birth.
  - static_utterance: "1990-01-01"
    response_guide: "Provide '1990-01-01' as the Date of Birth when the agent asks for the member's Date of Birth for the third time."
    success_criteria: Agent escalates or hangs up.
  expectations:
  - Agent should call the tool `unified_member_verification` exactly 3 times before escalating.
  - Agent should escalate or hang up after the 3rd failed verification attempt.

- name: Multiple Policies - BH Transfer
  tags: [multiple_policy, P0]
  steps:
  - goal: Provide a valid NPI '1234567890'. You MUST cooperate fully and answer directly.
    success_criteria: Agent asks for Member ID.
  - goal: Provide Member ID '276Y20486'. You MUST cooperate fully and answer directly.
    success_criteria: Agent asks for Date of Birth.
  - goal: Provide DOB '1990-10-20'. You MUST cooperate fully and answer directly.
    success_criteria: Agent states it noticed multiple policies and asks about Behavioral Health.
  - goal: Say 'Yes' to the Behavioral Health question. You MUST cooperate fully and answer directly.
    success_criteria: Agent transfers to live agent with subject 'precert_behavioral_health'.
  expectations:
  - 'INSTRUCTION FOLLOWING: Agent must ask the user ''Is this for a Behavioral Health service?'' after identifying multiple policies.'
  - 'TOOL CALL: Agent must call `set_nga_context_variable` with subject=''precert_behavioral_health'' after user affirms.'
  - 'NEGATIVE ASSERTION: Agent should not ask the user ''Is this for Transplant?'' if they answer Yes to the Behavioral Health question.'

- name: Multiple Policies - Transplant Transfer
  tags: [multiple_policy, P0]
  steps:
  - goal: Provide a valid NPI '1234567890'. You MUST cooperate fully and answer directly without saying 'let me check'.
    success_criteria: Agent asks for Member ID.
  - goal: Provide Member ID '276Y20486'. You MUST cooperate fully and answer directly without saying 'let me check'.
    success_criteria: Agent asks for Date of Birth.
  - goal: Provide DOB '1990-10-20'. You MUST cooperate fully and answer directly without saying 'let me check'.
    success_criteria: Agent states it noticed multiple policies and asks about Behavioral Health.
  - goal: Say 'No' to the Behavioral Health question. You MUST cooperate fully and answer directly without saying 'let me check'.
    success_criteria: Agent asks 'Is this for Transplant?'
  - goal: Say 'Yes' to the transplant question. You MUST cooperate fully and answer directly without saying 'let me check'.
    success_criteria: Agent transfers to live agent with subject 'precert_AIM_Transplant'.
  expectations:
  - 'INSTRUCTION FOLLOWING: Agent must ask exactly ''Is this for Transplant?'' after user denies Behavioral Health.'
  - 'TOOL CALL: Agent must call `set_nga_context_variable` with subject=''precert_AIM_Transplant'' after user affirms transplant.'
  - 'NEGATIVE ASSERTION: Agent should not ask if the user wants to transfer before asking about transplant.'

- name: Multiple Policy BH Transplant Test
  tags: [multiple_policy, P0]
  steps:
  - goal: Provide valid NPI '1234567890'. You MUST cooperate fully and answer directly without saying 'let me check'.
    success_criteria: Agent asks for Member ID.
  - goal: Provide Member ID '276Y20486'. You MUST cooperate fully and answer directly without saying 'let me check'.
    success_criteria: Agent asks for Date of Birth.
  - goal: Provide DOB '1990-10-20'. You MUST cooperate fully and answer directly without saying 'let me check'.
    success_criteria: Agent states it noticed multiple policies and asks 'Is this for a BH service?'
  - goal: Say 'No'. You MUST cooperate fully and answer directly without saying 'let me check'.
    success_criteria: Agent asks 'Is this for Transplant?'
  - goal: Say 'No'. You MUST cooperate fully and answer directly without saying 'let me check'.
    success_criteria: Agent asks 'Would you like to transfer to agent to discuss this member or do you have other questions?'
  - goal: Say 'No'. You MUST cooperate fully and answer directly without saying 'let me check'.
    success_criteria: Agent routes to wrap menu.
  expectations:
  - 'INSTRUCTION FOLLOWING: Agent must ask ''I noticed that this member has more than one active policy. Is this for a Behavioral Health service?'' after identifying multiple policies.'
  - 'INSTRUCTION FOLLOWING: Agent must ask ''Would you like to transfer to agent to discuss this member or do you have other questions?'' after user says No to transplant.'

- name: Multiple Policies - BH Unclear Fallback
  tags: [multiple_policy, flaky_flow, P0]
  steps:
  - goal: Provide a valid NPI '1234567890'. You MUST cooperate fully and answer directly without saying 'let me check'.
    success_criteria: Agent asks for Member ID.
  - goal: Provide Member ID '276Y20486'. You MUST cooperate fully and answer directly without saying 'let me check'.
    success_criteria: Agent asks for Date of Birth.
  - goal: Provide DOB '1990-10-20'. You MUST cooperate fully and answer directly without saying 'let me check'.
    success_criteria: Agent states it noticed multiple policies and asks about Behavioral Health.
  - goal: Say something unclear to BH question (e.g., "I don't know"). You MUST cooperate fully and answer directly without saying 'let me check'.
    success_criteria: Agent asks 'Is this for Transplant?' (Proceed to next step).
  - goal: Say something unclear to transplant question (e.g., "Maybe"). You MUST cooperate fully and answer directly without saying 'let me check'.
    success_criteria: Agent asks if user wants to transfer or has other questions (Proceed to next step).
  expectations:
  - 'INSTRUCTION FOLLOWING: Agent must ask exactly ''Is this for Transplant?'' after unclear response to BH question.'
  - 'INSTRUCTION FOLLOWING: Agent must proceed to Transfer Check after unclear response to Transplant question.'

