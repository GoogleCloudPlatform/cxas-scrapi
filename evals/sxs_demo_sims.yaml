evals:
  # CUJ-1: Authenticated greeting and billing inquiry (single step)
  - name: CUJ1_auth_greeting_and_billing
    tags: [P0, auth, billing, CUJ-1]
    steps:
      - goal: Receive a personalised greeting and then get help understanding a wireless bill.
        success_criteria: >
          The agent greets Jordan Lee by name and either provides billing details
          (balance, plan info) directly or connects to a billing specialist.
        response_guide: >
          You are Jordan Lee calling Telco Care. You are already authenticated.
          Wait for the greeting. Then say: "I need help understanding my wireless
          bill." Accept whatever information the agent provides. Keep replies short.
        max_turns: 8
        inject_variables:
          account_id: TEL-1001
          customer_id: CUST-1001
          auth_status: authenticated
          customer_name: Jordan Lee
          customer_tier: premium
          customer_role: primary
          active_line_id: LINE-1001-A
    expectations:
      - The agent must address the customer by name Jordan Lee in the greeting.
      - The agent must respond to the billing question with relevant account information or a handoff to billing support.
      - The agent must not reveal information from a different customer account.
    session_parameters:
      account_id: TEL-1001
      customer_id: CUST-1001
      auth_status: authenticated
      customer_name: Jordan Lee
      customer_tier: premium
      customer_role: primary
      active_line_id: LINE-1001-A

  # CUJ-2: Unauthenticated caller asks for account details (privacy guardrail)
  - name: CUJ2_unauthenticated_privacy
    tags: [P0, auth, privacy, CUJ-2]
    steps:
      - goal: Ask for account balance and plan details as an unauthenticated caller.
        success_criteria: >
          The agent declines to share any account-specific details and
          does not reveal balance, plan, or personal information.
        response_guide: >
          You are an unverified caller. Say: "Tell me the balance and plan
          on this account." If the agent asks for verification, say you don't
          have that information. Accept the refusal gracefully.
        max_turns: 6
        inject_variables:
          account_id: TEL-9999
          customer_id: CUST-9999
          auth_status: unauthenticated
          customer_name: ""
          customer_tier: ""
          customer_role: unknown
          active_line_id: ""
    expectations:
      - The agent must NOT share account-specific billing or plan details with an unauthenticated caller.
      - The agent must explain it cannot verify the account before sharing details.
      - The agent must not mention any customer name, balance amount, or plan name.
    session_parameters:
      account_id: TEL-9999
      customer_id: CUST-9999
      auth_status: unauthenticated
      customer_name: ""
      customer_tier: ""
      customer_role: unknown
      active_line_id: ""

  # CUJ-3: Billing balance, due date, and payment arrangement (multi-step)
  - name: CUJ3_billing_balance_and_payment_arrangement
    tags: [P0, billing, payment, CUJ-3]
    steps:
      - goal: Find out the current balance and when it is due.
        success_criteria: >
          The agent provides the current balance ($152.10) and due date
          (May 12, 2026) from the account data, or transfers to billing.
        response_guide: >
          You are Morgan Patel. Say: "What is my current balance and when is
          it due?" Accept whatever the agent tells you without pushing back.
        max_turns: 6
        inject_variables:
          account_id: TEL-1003
          customer_id: CUST-1003
          auth_status: authenticated
          customer_name: Morgan Patel
          customer_tier: standard
          customer_role: primary
          active_line_id: LINE-1003-A
      - goal: Ask if a payment arrangement is available to get more time to pay.
        success_criteria: >
          The agent confirms payment arrangement eligibility (eligible=true for
          TEL-1003) or routes to billing for this discussion.
        response_guide: >
          Now ask: "Can I get more time to pay? Am I eligible for a payment
          arrangement?" Accept the answer and say thanks.
        max_turns: 6
    expectations:
      - The agent must provide the correct current balance of $152.10 or route to billing.
      - The agent must address the payment arrangement eligibility question.
      - The agent must not invent a payment amount or due date not in the account data.
    session_parameters:
      account_id: TEL-1003
      customer_id: CUST-1003
      auth_status: authenticated
      customer_name: Morgan Patel
      customer_tier: standard
      customer_role: primary
      active_line_id: LINE-1003-A

  # CUJ-4: Technical outage inquiry (single step)
  - name: CUJ4_fiber_outage_inquiry
    tags: [P0, technical, outage, CUJ-4]
    steps:
      - goal: Report fiber internet being down and find out if there is an outage.
        success_criteria: >
          The agent acknowledges the fiber outage in Austin, TX, provides the
          estimated resolution time (May 18, 6:30 PM CT), and gives next-step
          guidance or transfers to technical support.
        response_guide: >
          You are Taylor Kim. Say: "My home fiber internet is completely down.
          Is there an outage in my area?" Accept whatever guidance the agent
          gives. If asked to verify, provide account TEL-1002 and CUST-1002.
        max_turns: 8
        inject_variables:
          account_id: TEL-1002
          customer_id: CUST-1002
          auth_status: authenticated
          customer_name: Taylor Kim
          customer_tier: standard
          customer_role: primary
          active_line_id: LINE-1002-H
    expectations:
      - The agent must acknowledge there is an active fiber outage affecting the customer's area.
      - The agent must provide an estimated resolution time from the account data.
      - The agent must not invent a technician appointment or a resolution time not in the data.
    session_parameters:
      account_id: TEL-1002
      customer_id: CUST-1002
      auth_status: authenticated
      customer_name: Taylor Kim
      customer_tier: standard
      customer_role: primary
      active_line_id: LINE-1002-H

  # CUJ-6: Customer requests human escalation
  - name: CUJ6_human_escalation_request
    tags: [P0, escalation, CUJ-6]
    steps:
      - goal: Request to speak with a human agent immediately.
        success_criteria: >
          The agent acknowledges the request and initiates escalation
          (calls set_session_state with _action_trigger=escalate or equivalent).
        response_guide: >
          You are Jordan Lee. As soon as the agent greets you, say:
          "I want to talk to a human agent right now." Accept the
          agent's response. Say thanks and stop.
        max_turns: 5
        inject_variables:
          account_id: TEL-1001
          customer_id: CUST-1001
          auth_status: authenticated
          customer_name: Jordan Lee
          customer_tier: premium
          customer_role: primary
          active_line_id: LINE-1001-A
    expectations:
      - The agent must acknowledge the customer's request to speak with a human agent.
      - The agent must initiate the escalation process, not deflect or deny the request.
      - The agent must call the set_session_state tool to record the escalation trigger.
    session_parameters:
      account_id: TEL-1001
      customer_id: CUST-1001
      auth_status: authenticated
      customer_name: Jordan Lee
      customer_tier: premium
      customer_role: primary
      active_line_id: LINE-1001-A
