name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          release-type: python
          token: ${{ secrets.GH_TOKEN }}

  publish-pypi:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/cxas-scrapi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: false
          python-version: '3.12'
      - name: Build package
        run: uv build
      - name: Authenticate to OSS Exit Gate
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'
      - name: Stage package in OSS Exit Gate Artifact Registry
        run: |
          uv venv .exit-gate-venv
          uv pip install --python .exit-gate-venv/bin/python keyring twine keyrings.google-artifactregistry-auth
          .exit-gate-venv/bin/twine upload \
            --repository-url https://us-python.pkg.dev/oss-exit-gate-prod/cxas-scrapi--pypi \
            dist/*
      - name: Trigger OSS Exit Gate release
        run: |
          MANIFEST_FILE="$(mktemp)"
          echo '{"publish_all": true}' > "${MANIFEST_FILE}"
          gcloud storage cp "${MANIFEST_FILE}" \
            "gs://oss-exit-gate-prod-projects-bucket/cxas-scrapi/pypi/manifests/manifest-${{ github.run_id }}-${{ github.run_attempt }}.json"
          rm -f "${MANIFEST_FILE}"
