schema_version: "1.0"

overlays:
  voice:
    root_agent:
      append_rules:
        - "Keep spoken responses for {brand_name} concise and natural, avoiding markdown bullet lists or raw URLs."
        - "Pace currency amounts, dates, and the last four digits of cards or accounts clearly for voice callers."
    guide_agent:
      append_rules:
        - "Summarize knowledge answers for {brand_name} on voice calls to two or three concise sentences and offer targeted follow-ups."
        - "Do not spell out long web URLs aloud; refer callers briefly to online self-service at {web_host}."

  digital:
    root_agent:
      append_rules:
        - "Use concise, clearly structured responses for {brand_name} on digital channels and point self-service tasks to {web_host}."
        - "Avoid repeating details already visible in the chat transcript before handing off to a specialist."
    credit_cards_agent:
      append_rules:
        - "Format card summaries and limit confirmations for {brand_name} with masked last-4 digits, current status, and USD amount."
        - "After completing card servicing actions, include a reminder about digital card controls on {web_host}."
