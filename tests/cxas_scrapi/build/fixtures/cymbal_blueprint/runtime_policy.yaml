schema_version: "1.0"

surfaces:
  call-center:
    modality: "voice"
    auth_state: "unauthenticated"
    entry_agent: "root_agent"
    blocked_agents: []
    description: "Inbound PSTN/SIP call-center telephony trunk starting unauthenticated with T-PIN or step-up verification."

  mobile-app:
    modality: "digital"
    auth_state: "pre_authenticated"
    entry_agent: "root_agent"
    blocked_agents: []
    description: "In-app mobile banking digital assistant initialized with a pre-authenticated OAuth assertion token."

  public-web:
    modality: "digital"
    auth_state: "unauthenticated"
    entry_agent: "root_agent"
    blocked_agents:
      - "credit_cards_agent"
      - "wire_transfer_agent"
    description: "Unauthenticated public website chat restricted to public product guidance and human handover."

  olb:
    modality: "digital"
    auth_state: "authenticated"
    entry_agent: "root_agent"
    blocked_agents: []
    description: "Authenticated browser Online Banking (OLB) session with full transactional specialist access."

segments:
  mass:
    description: "Standard retail banking segment."
    blocked_agents: []

  employee:
    description: "Employee staff segment (card limit self-service routed via specialist human desk)."
    blocked_agents:
      - "credit_cards_agent"

kill_switch:
  enabled: true
  expression_template: "session_ctx.disabled_agents.{agent} == true"
