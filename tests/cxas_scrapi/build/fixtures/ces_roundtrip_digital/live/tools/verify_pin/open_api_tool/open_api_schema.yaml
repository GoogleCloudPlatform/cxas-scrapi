openapi: 3.0.0
info:
  title: verify_pin
  version: 1.0.0
  description: Verify telephone banking PIN against Cymbal Bank ID / Cymbal-Kundennummer
    for Cymbal Bank via server-side BFA.
servers:
- url: $env_var
paths:
  /v1/auth/verify-pin:
    post:
      operationId: verifyPin
      summary: Verify telephone banking PIN against Cymbal Bank ID / Cymbal-Kundennummer
        for Cymbal Bank via server-side BFA.
      description: Verify telephone banking PIN against Cymbal Bank ID / Cymbal-Kundennummer
        for Cymbal Bank via server-side BFA.
      responses:
        '200':
          description: Successful backend API response.
          content:
            application/json:
              schema:
                type: object
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
