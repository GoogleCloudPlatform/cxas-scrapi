# ==============================================================================
# Vector Steering GitHub Actions Workflow Template for CXAS SCRAPI Workspaces
# Validates training corpus + CXAS lint on PRs, and syncs committed embeddings
# + triggers Vertex AI Vector Search re-indexing using OIDC Workload Identity.
# ==============================================================================
name: Vector Steering Vector Index & CXAS Lint

on:
  pull_request:
    paths:
      - "vector_steering/**"
      - "cxas_app/**"
  push:
    branches:
      - develop
      - main
    paths:
      - "vector_steering/**/*.json"

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install cxas-scrapi
      - name: Run Vector Steering Strict Corpus & PII Gate
        run: |
          python .agents/skills/cxas-vector-steering/scripts/analyze_dataset.py \
            --config vector_steering/vector_steering.yaml \
            --strict
      - name: Run CXAS Structural Linter
        run: |
          cxas lint --validate-only

  sync-vector-index:
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      TARGET_ENV: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SERVICE_ACCOUNT }}
      - run: pip install cxas-scrapi google-cloud-aiplatform
      - run: |
          python .agents/skills/cxas-vector-steering/scripts/embed_and_sync.py \
            --config vector_steering/vector_steering.yaml \
            --env "${TARGET_ENV}" \
            --upload-and-trigger
